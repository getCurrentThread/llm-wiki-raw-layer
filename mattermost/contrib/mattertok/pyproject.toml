[project]
name = "mattertok"
version = "0.1.0"
description = "Mattermost 메시지 조회/검색/실시간 수신/전송 클라이언트 (웹훅 불필요, REST API v4 + WebSocket)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "websockets>=14",
]

[project.scripts]
mattertok = "mattertok.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mattertok"]

